# Model profiles for run.py (offline) and run_realtime.py (realtime). The table key is the
# exact value accepted by `--model`. Every request-affecting option is included in the
# cache key.

[models.scribe_v2]
provider = "elevenlabs"
adapter = "elevenlabs_file"
model = "scribe_v2"
api_key_env = "ELEVENLABS_API_KEY"
cache_generation = "offline-2026-08-23-a"

[models.scribe_v2.connection]
endpoint = "https://api.elevenlabs.io/v1/speech-to-text"

[models.scribe_v2.request]
language_code = "en"
tag_audio_events = true
no_verbatim = false
timestamps_granularity = "word"
diarize = false
webhook = false
file_format = "other"
enable_logging = false

[models."nova-3"]
provider = "deepgram"
adapter = "deepgram_file"
model = "nova-3"
api_key_env = "DEEPGRAM_API_KEY"
cache_generation = "offline-2026-08-23-a"

[models."nova-3".connection]
endpoint = "https://api.deepgram.com/v1/listen"

[models."nova-3".request]
language = "en"
punctuate = false
smart_format = false
filler_words = true
numerals = false
measurements = false
dictation = false
profanity_filter = false
paragraphs = false
utterances = false
mip_opt_out = true

[models."universal-3-5-pro"]
provider = "assemblyai"
adapter = "assemblyai_file"
model = "universal-3-5-pro"
api_key_env = "ASSEMBLYAI_API_KEY"
cache_generation = "offline-2026-08-23-a"

[models."universal-3-5-pro".connection]
api_base = "https://api.assemblyai.com"
poll_interval_s = 1.0

[models."universal-3-5-pro".request]
language_code = "en"
punctuate = false
format_text = false
disfluencies = true
filter_profanity = false
speaker_labels = false

[models."ink-whisper"]
provider = "cartesia"
adapter = "cartesia_file"
model = "ink-whisper"
api_key_env = "CARTESIA_API_KEY"
cache_generation = "offline-2026-08-23-a"

[models."ink-whisper".connection]
endpoint = "https://api.cartesia.ai/stt"
api_version = "2026-03-01"

[models."ink-whisper".request]

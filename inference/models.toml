[models."nova-3-realtime".connection]
endpoint = "wss://api.deepgram.com/v1/listen"
sample_rate_hz = 16000

[models."nova-3-realtime".request]
encoding = "linear16"
sample_rate = 16000
channels = 1
language = "en"
interim_results = true
punctuate = false
smart_format = false
filler_words = true
numerals = false
mip_opt_out = true


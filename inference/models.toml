adapter = "together_realtime"
model = "nvidia/nemotron-3-asr-streaming-0.6b"
api_key_env = "TOGETHER_API_KEY"
cache_generation = "realtime-2026-10-14"

[models."nemotron-3-asr-streaming-realtime".connection]
endpoint = "wss://api.together.ai/v1/realtime"
sample_rate_hz = 16000

[models."nemotron-3-asr-streaming-realtime".request]
input_audio_format = "pcm_s16le_16000"
language = "en"

interim_results = true

[models."mai-transcribe-2-realtime"]
provider = "microsoft"
adapter = "microsoft_realtime"
model = "MAI-Transcribe-2-Streaming"
api_key_env = "AZURE_FOUNDRY_API_KEY"
cache_generation = "realtime-2026-10-14"

[models."mai-transcribe-2-realtime".connection]

adapter = "smallest_file"
model = "pulse-pro"
api_key_env = "SMALLEST_API_KEY"
cache_generation = "offline-2026-10-15-a"

[models."pulse-pro".connection]
endpoint = "https://api.smallest.ai/waves/v1/stt/"
